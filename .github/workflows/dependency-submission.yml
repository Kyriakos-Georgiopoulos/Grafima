name: Dependency submission

# Dependabot has two halves. Version updates read gradle/libs.versions.toml
# directly and need nothing from this workflow. Security alerts read the
# dependency graph instead, and GitHub does not build one for Gradle the way it
# does for Maven or npm — without a submitted graph, a CVE in a transitive
# dependency is never reported. This submits it.
on:
  push:
    # Alerts are computed from the default branch only, so nothing else is worth
    # submitting. The workflow's own path is listed so the first merge produces
    # a graph rather than waiting for the next dependency change.
    branches: [develop]
    paths:
      - '**/*.gradle.kts'
      - 'gradle/libs.versions.toml'
      - 'gradle/wrapper/gradle-wrapper.properties'
      - 'gradle.properties'
      - '.github/workflows/dependency-submission.yml'
  workflow_dispatch:

concurrency:
  group: dependency-submission
  cancel-in-progress: true

# Submitting a graph is a write to the repository's dependency data.
permissions:
  contents: write

env:
  JAVA_VERSION: '21'

jobs:
  submit:
    name: Submit the dependency graph
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      # Resolves every configuration in every module and submits the result.
      # iOS configurations resolve as ordinary Maven artifacts on Linux; nothing
      # here compiles, so no Kotlin/Native toolchain is downloaded.
      - uses: gradle/actions/dependency-submission@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
