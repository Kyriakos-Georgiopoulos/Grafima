name: CI

on:
  push:
    branches: [main, develop]
    paths-ignore: ['**.md', 'docs/**', '.gitignore']
  pull_request:
    paths-ignore: ['**.md', 'docs/**', '.gitignore']
  # Lets any branch be run manually from the Actions tab, without opening a PR.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  JAVA_VERSION: '21'
  # Bumping this invalidates every emulator snapshot at once.
  ANDROID_API_LEVEL: 30

jobs:
  # Runs on every push at 1× the minute rate. iOS compilation tasks are
  # automatically skipped on Linux hosts, so this covers the Android app,
  # lint, and the JVM run of the commonTest suites.
  android:
    name: Android build & JVM tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v6
      # Style first: it is the cheapest signal, so a formatting slip fails in
      # seconds instead of after the full build and test run. buildSrc is a
      # separate build — the root task does not reach it, and Gradle only ever
      # builds its jar, so its check has to be asked for by name.
      - name: Check formatting
        run: |
          ./gradlew ktlintCheck
          ./gradlew -p buildSrc ktlintCheck
      - name: Build, lint, and run JVM tests
        run: ./gradlew build
      # Fails if the public API drifts from library/api/. Run
      # `./gradlew :library:updateKotlinAbi` and commit the diff to accept it.
      - name: Check public API has not drifted
        run: ./gradlew :library:checkKotlinAbi
      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-reports
          path: |
            **/build/reports/tests/**
            **/build/reports/ktlint/**
            **/build/reports/*.html

  # The shared uiTest suite as Android instrumented tests. GitHub-hosted
  # runners have no physical devices, so CI uses an emulator; the same tests
  # run on real hardware locally via :library:connectedAndroidDeviceTest.
  # Ubuntu bills at 1× and exposes KVM, so the emulator is hardware-accelerated.
  android-ui:
    name: Android UI tests (emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v6
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # No AVD snapshot caching here on purpose: a cached snapshot that goes
      # stale against a newer runner image or emulator build fails to boot with
      # "Connection refused", and a matching cache key skips the rebuild that
      # would fix it. A cold boot costs a couple of minutes and always works.
      - name: Run instrumented UI tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.ANDROID_API_LEVEL }}
          arch: x86_64
          target: aosp_atd
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: ./gradlew :library:connectedAndroidDeviceTest
      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-ui-reports
          path: library/build/reports/androidTests/**

  # The Android job's `./gradlew build` already compiles and tests the jvm
  # target, but a failure there reads as an Android failure. This job owns the
  # desktop signal, and adds the one thing `build` never does: assembling the
  # runtime image, which is what catches a wrong mainClass or an unresolvable
  # module. Packaging into a .deb or .dmg needs OS tooling and proves no more.
  desktop:
    name: Desktop build & JVM tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v6
      - name: Run the JVM test suite
        run: ./gradlew :library:jvmTest
      - name: Assemble the desktop sample
        run: ./gradlew :desktopApp:createDistributable
      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-reports
          path: library/build/reports/tests/**

  # macOS minutes bill at 10× — this job is kept lean: compile the iOS
  # targets, link the sample framework, and run the full test suite
  # (commonTest + UI tests) on a simulator.
  ios:
    name: iOS build & simulator tests
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v6
      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-
      - name: Pick an available iPhone simulator
        id: sim
        run: |
          DEVICE=$(xcrun simctl list devices available | grep -oE 'iPhone [^(]+' | head -1 | xargs)
          if [ -z "$DEVICE" ]; then
            echo "No iPhone simulator available on this runner" >&2
            exit 1
          fi
          echo "device=$DEVICE" >> "$GITHUB_OUTPUT"
          echo "Using simulator: $DEVICE"
      - name: Run library tests on the simulator and link the sample framework
        run: >
          ./gradlew
          :library:iosSimulatorArm64Test
          :sample:linkDebugFrameworkIosSimulatorArm64
          "-PiosSimulatorDevice=${{ steps.sim.outputs.device }}"
      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ios-reports
          path: library/build/reports/tests/**
