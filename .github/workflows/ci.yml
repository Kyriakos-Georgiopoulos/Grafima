name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  # Lets any branch be run manually from the Actions tab, without opening a PR.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  JAVA_VERSION: '21'
  # Bumping this invalidates every emulator snapshot at once.
  ANDROID_API_LEVEL: 30

jobs:
  # Documentation used to be skipped with paths-ignore, but `develop` and `main`
  # require the three jobs below, and a workflow that never runs never reports —
  # a docs-only PR sat on "Expected — waiting for status to be reported" forever.
  # Deciding here instead keeps one workflow owning those three check names.
  # A job skipped by `if` reports success to branch protection, so a docs-only
  # change satisfies the requirement without paying for a build or an emulator.
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Decide whether anything outside the docs changed
        id: filter
        run: |
          set -euo pipefail
          case "${{ github.event_name }}" in
            pull_request)
              # Explicit refspec: checkout only creates a tracking ref for the
              # branch it checked out, so origin/<base> is not there to diff against.
              base="${{ github.base_ref }}"
              git fetch --no-tags --quiet origin "+refs/heads/$base:refs/remotes/origin/$base"
              files=$(git diff --name-only "origin/$base...HEAD")
              ;;
            push)
              before="${{ github.event.before }}"
              # A new branch reports an all-zero "before" and has nothing to diff.
              if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
                echo "code=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              files=$(git diff --name-only "$before" "${{ github.sha }}")
              ;;
            *)
              echo "code=true" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac
          echo "Changed files:"
          echo "$files"
          if [ -z "$files" ]; then
            echo "code=false" >> "$GITHUB_OUTPUT"
          elif printf '%s\n' "$files" | grep -qvE '(\.md$|^docs/|^\.gitignore$)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  # Runs on every push at 1× the minute rate. iOS compilation tasks are
  # automatically skipped on Linux hosts, so this covers the Android app,
  # lint, and the JVM run of the commonTest suites.
  android:
    name: Android build & JVM tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v6
      # Style first: it is the cheapest signal, so a formatting slip fails in
      # seconds instead of after the full build and test run.
      - name: Check formatting
        run: ./gradlew ktlintCheck
      - name: Build, lint, and run JVM tests
        run: ./gradlew build
      # Fails if the public API drifts from library/api/. Run
      # `./gradlew :library:updateKotlinAbi` and commit the diff to accept it.
      - name: Check public API has not drifted
        run: ./gradlew :library:checkKotlinAbi
      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-reports
          path: |
            **/build/reports/tests/**
            **/build/reports/ktlint/**
            **/build/reports/*.html

  # The shared uiTest suite as Android instrumented tests. GitHub-hosted
  # runners have no physical devices, so CI uses an emulator; the same tests
  # run on real hardware locally via :library:connectedAndroidDeviceTest.
  # Ubuntu bills at 1× and exposes KVM, so the emulator is hardware-accelerated.
  android-ui:
    name: Android UI tests (emulator)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v6
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # No AVD snapshot caching here on purpose: a cached snapshot that goes
      # stale against a newer runner image or emulator build fails to boot with
      # "Connection refused", and a matching cache key skips the rebuild that
      # would fix it. A cold boot costs a couple of minutes and always works.
      - name: Run instrumented UI tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.ANDROID_API_LEVEL }}
          arch: x86_64
          target: aosp_atd
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: ./gradlew :library:connectedAndroidDeviceTest
      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-ui-reports
          path: library/build/reports/androidTests/**

  # macOS minutes bill at 10× — this job is kept lean: compile the iOS
  # targets, link the sample framework, and run the full test suite
  # (commonTest + UI tests) on a simulator.
  ios:
    name: iOS build & simulator tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v6
      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-
      - name: Pick an available iPhone simulator
        id: sim
        run: |
          DEVICE=$(xcrun simctl list devices available | grep -oE 'iPhone [^(]+' | head -1 | xargs)
          if [ -z "$DEVICE" ]; then
            echo "No iPhone simulator available on this runner" >&2
            exit 1
          fi
          echo "device=$DEVICE" >> "$GITHUB_OUTPUT"
          echo "Using simulator: $DEVICE"
      - name: Run library tests on the simulator and link the sample framework
        run: >
          ./gradlew
          :library:iosSimulatorArm64Test
          :sample:linkDebugFrameworkIosSimulatorArm64
          "-PiosSimulatorDevice=${{ steps.sim.outputs.device }}"
      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ios-reports
          path: library/build/reports/tests/**
